name: Discord Bot Service Sync Listener

on:
  repository_dispatch:
    types: [ bot-api-updated ]
  workflow_dispatch:

jobs:
  sync_check:
    name: Verify App Compatibility with Bot API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Application Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Log Sync Notification
        run: |
          echo "Received bot-api-updated event from discord_music_bot!"
          echo "Payload: ${{ toJson(github.event.client_payload) }}"
